[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "python-wrap"
dynamic = ["version"]
description = "A typed, zero-dependency resilience toolkit: retry, circuit breakers, timeouts, rate limits, caching, bulkheads and policies, with sync and async parity."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mahmoud Ahmed", email = "pythondeveloper6@gmail.com" }]
maintainers = [{ name = "Mahmoud Ahmed", email = "pythondeveloper6@gmail.com" }]
keywords = [
    "resilience",
    "decorators",
    "retry",
    "memoize",
    "cache",
    "timeout",
    "rate-limit",
    "circuit-breaker",
    "debounce",
    "throttle",
    "asyncio",
    "utilities",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: AsyncIO",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Typing :: Typed",
]
# Zero runtime dependencies is a feature: this package should be safe to add to any project.
dependencies = []

[project.urls]
Homepage = "https://github.com/LitePy/PythonWrap"
Documentation = "https://pythonwrap.readthedocs.io"
Source = "https://github.com/LitePy/PythonWrap"
Issues = "https://github.com/LitePy/PythonWrap/issues"
Changelog = "https://github.com/LitePy/PythonWrap/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.100",
    "ruff>=0.8",
    "mypy>=1.13",
    "opentelemetry-api>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocs-redirects>=1.2.3",
    "mkdocstrings[python]>=1.0.6",
]
release = ["build>=1.2", "twine>=6.0"]

[tool.hatch.version]
path = "src/python_wrap/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/python_wrap"]
exclude = ["**/__pycache__", "**/*.py[cod]", "**/.DS_Store"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/python_wrap",
    "/tests",
    "/examples",
    "/benchmarks",
    "/scripts/check_installed.py",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
]
exclude = ["**/__pycache__", "**/*.py[cod]", "**/.DS_Store"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
source = ["python_wrap"]
branch = true

[tool.coverage.report]
show_missing = true
# A floor, not a target: platform-specific branches are skipped on some CI cells.
fail_under = 80
exclude_also = ["if TYPE_CHECKING:", "@overload", "raise NotImplementedError", "\\.\\.\\."]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["python_wrap"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/python_wrap"]
