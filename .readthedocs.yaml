# Read the Docs configuration.
# https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  # uv installs the `docs` dependency group from the lockfile, so the hosted build uses
  # the same versions as `mkdocs build --strict` in CI.
  # https://docs.readthedocs.com/platform/stable/build-customization.html#install-dependencies-with-uv
  jobs:
    pre_create_environment:
      - asdf plugin add uv
      - asdf install uv latest
      - asdf global uv latest
    create_environment:
      - uv venv "${READTHEDOCS_VIRTUALENV_PATH}"
    install:
      # Installs the project (mkdocstrings reads docstrings from it) and the docs group.
      - UV_PROJECT_ENVIRONMENT="${READTHEDOCS_VIRTUALENV_PATH}" uv sync --frozen --no-default-groups --group docs

mkdocs:
  configuration: mkdocs.yml
  fail_on_warning: true
