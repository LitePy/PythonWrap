# Publish on a version tag, using PyPI Trusted Publishing.
#
# One-time setup (a publisher registered on PyPI and TestPyPI, and two GitHub
# environments) is described in RELEASING.md. It must exist before the first tag: a tag
# pushed against an unregistered publisher fails at the upload, and a version number on
# PyPI can never be reused.
#
# Every tagged version goes to TestPyPI and is installed back from that index first.
# Final versions then go to PyPI; pre-releases remain on TestPyPI only.
#
# No API token is involved anywhere in this file, and none should be added. Trusted
# Publishing mints a short-lived credential scoped to this workflow and environment.
name: Release

on:
  push:
    tags:
      - "v*"
  # Lets the build-and-verify half be exercised without cutting a tag.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify the distributions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          # No cache in the release build: a poisoned cache must never reach a
          # published artifact.
          enable-cache: false
          python-version: "3.13"

      # Read the version from the file rather than importing the package: the build
      # backend reads it from the same place, so this is what would actually be
      # published. A tag that disagrees with it is how a release goes out under the
      # wrong number, and that is unfixable afterwards.
      - name: The tag must match the packaged version
        id: meta
        run: |
          packaged=$(sed -nE 's/^__version__ *= *"([^"]+)".*/\1/p' src/python_wrap/__init__.py | head -n1)
          if [ -z "$packaged" ]; then
            echo "::error::could not read __version__ from src/python_wrap/__init__.py"
            exit 1
          fi
          echo "version=$packaged" >> "$GITHUB_OUTPUT"
          if printf '%s' "$packaged" | grep -Eq '^[0-9]+(\.[0-9]+)*(\.post[0-9]+)?$'; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            echo "tag=$tag packaged=$packaged"
            if [ "$tag" != "$packaged" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match python_wrap.__version__ ($packaged)"
              exit 1
            fi
          fi

      - name: Install Redis for the release integration gate
        run: sudo apt-get update && sudo apt-get install -y redis-server

      - name: Verify distributed coordination before publishing
        env:
          PW_REQUIRE_REDIS: "1"
        run: |
          uv sync --frozen --group dev
          uv run --no-sync pytest tests/test_redis_backends.py tests/test_distributed_contracts.py tests/test_fork_safety.py

      - name: Build
        run: uv build

      - name: twine check
        run: uvx twine check --strict dist/*

      - name: Smoke-test the wheel in a clean environment
        env:
          PACKAGE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          python3 -m zipfile -l dist/*.whl | grep -q 'python_wrap/py.typed'
          uv venv "$RUNNER_TEMP/smoke" --python 3.13
          uv pip install --python "$RUNNER_TEMP/smoke" dist/*.whl
          "$RUNNER_TEMP/smoke/bin/python" -I scripts/check_installed.py "$PACKAGE_VERSION"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/python-wrap
    permissions:
      # The OIDC token Trusted Publishing exchanges for a short-lived upload token.
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          # Re-running after a failed attempt should not be blocked by files that
          # already landed.
          skip-existing: true

  verify-testpypi:
    name: Install and verify from TestPyPI
    needs: [build, publish-testpypi]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.13"
      - name: Install the exact published version without fallback indexes
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          uv venv "$RUNNER_TEMP/testpypi-smoke" --python 3.13
          for attempt in 1 2 3 4 5 6; do
            if uv pip install --python "$RUNNER_TEMP/testpypi-smoke" --no-deps --no-cache \
              --index-url https://test.pypi.org/simple/ "python-wrap==$VERSION"; then
              break
            fi
            if [ "$attempt" = 6 ]; then exit 1; fi
            sleep 10
          done
          "$RUNNER_TEMP/testpypi-smoke/bin/python" -I scripts/check_installed.py "$VERSION"

  publish-pypi:
    name: Publish to PyPI
    needs: [build, verify-testpypi]
    if: github.ref_type == 'tag' && needs.build.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    environment:
      # Add a required reviewer to this environment to make every real upload wait for
      # one click.
      name: pypi
      url: https://pypi.org/p/python-wrap
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          # PEP 740 attestations, signed by the same OIDC identity.
          attestations: true

  verify-pypi:
    name: Install and verify from PyPI
    needs: [build, publish-pypi]
    if: github.ref_type == 'tag' && needs.build.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.13"
      - name: Install the exact published version
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          uv venv "$RUNNER_TEMP/pypi-smoke" --python 3.13
          for attempt in 1 2 3 4 5 6; do
            if uv pip install --python "$RUNNER_TEMP/pypi-smoke" --no-deps --no-cache \
              --index-url https://pypi.org/simple/ "python-wrap==$VERSION"; then
              break
            fi
            if [ "$attempt" = 6 ]; then exit 1; fi
            sleep 10
          done
          "$RUNNER_TEMP/pypi-smoke/bin/python" -I scripts/check_installed.py "$VERSION"

  github-release:
    name: Create the GitHub release
    needs: [build, verify-testpypi, publish-pypi, verify-pypi]
    # Whichever publish job applied must have succeeded; the other is skipped.
    if: >-
      !cancelled() && github.ref_type == 'tag' && needs.build.result == 'success'
      && needs.verify-testpypi.result == 'success'
      && ((needs.build.outputs.prerelease == 'true' && needs.publish-pypi.result == 'skipped')
          || (needs.publish-pypi.result == 'success' && needs.verify-pypi.result == 'success'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist/

      # The release notes are the CHANGELOG section for this version: from its `## `
      # heading up to the next one. Matches `## [0.2.0] - date` and `## 0.2.0`.
      - name: Extract the changelog section
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            /^## / {
              if (found) exit
              if (index($0, "[" v "]") || index($0, "## " v) == 1) { found = 1; next }
            }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::warning::no CHANGELOG.md section found for $VERSION"
            echo "See CHANGELOG.md for what changed in this release." > release-notes.md
          fi
          cat release-notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            "${flags[@]}"
