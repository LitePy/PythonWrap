# Build check for the documentation site.
#
# Read the Docs does the hosting (see .readthedocs.yaml). This workflow only catches
# breakage after changes land on main: `--strict` turns a broken link, a page missing
# from the nav or a docstring mkdocstrings cannot render into a failed check.
name: Docs

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_COLOR: "1"

jobs:
  build:
    name: mkdocs build --strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.13"

      # The package itself is installed too, because mkdocstrings reads the docstrings
      # from it. The dev group is included because some examples are pytest tests.
      - run: uv sync --frozen --no-default-groups --group docs --group dev

      - name: Build the site
        run: uv run --no-sync mkdocs build --strict
        env:
          NO_MKDOCS_2_WARNING: "1"

      # Every ```python block in docs/ is executed, so an example that drifts from the
      # real API fails review instead of misleading a reader.
      - name: Run the documentation examples
        run: uv run --no-sync python scripts/check_docs_examples.py
